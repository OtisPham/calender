<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Calendar Container -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Calendar Body -->
    <rect x="0" y="44" width="384" height="328" rx="32" fill="#ffffff"/>
    
    <!-- Calendar Header (Emerald) -->
    <path d="M0 76 C0 58.327 14.327 44 32 44 L352 44 C369.673 44 384 58.327 384 76 L384 120 L0 120 Z" fill="#047857"/>
    
    <!-- Calendar Rings -->
    <rect x="76" y="20" width="24" height="48" rx="12" fill="#e2e8f0"/>
    <rect x="80" y="22" width="16" height="44" rx="8" fill="#cbd5e1"/>
    
    <rect x="284" y="20" width="24" height="48" rx="12" fill="#e2e8f0"/>
    <rect x="288" y="22" width="16" height="44" rx="8" fill="#cbd5e1"/>

    <!-- Crescent Moon & Lotus (Lịch Âm / Tâm linh) -->
    <!-- Crescent Moon -->
    <path d="M120 220 A 48 48 0 1 0 160 276 A 40 40 0 1 1 120 220 Z" fill="url(#goldGrad)"/>
    
    <!-- Teaching Hat / Book icon (Lịch Dạy) -->
    <g transform="translate(210, 190) scale(1.1)">
      <!-- Open Book -->
      <path d="M10 25 C25 20, 50 20, 60 28 C70 20, 95 20, 110 25 L110 75 C95 70, 70 70, 60 78 C50 70, 25 70, 10 75 Z" fill="#059669" opacity="0.9"/>
      <path d="M60 28 L60 78" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 36 C35 32, 48 33, 54 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M22 48 C35 44, 48 45, 54 48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M66 36 C72 33, 85 32, 98 36" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
      <path d="M66 48 C72 45, 85 44, 98 48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- Star decoration -->
    <path d="M174 195 L178 205 L188 206 L180 213 L183 223 L174 217 L165 223 L168 213 L160 206 L170 205 Z" fill="#facc15"/>

    <!-- Bottom Dots indicator -->
    <circle cx="140" cy="326" r="8" fill="#10b981"/>
    <circle cx="192" cy="326" r="8" fill="#f59e0b"/>
    <circle cx="244" cy="326" r="8" fill="#3b82f6"/>
  </g>
</svg>
